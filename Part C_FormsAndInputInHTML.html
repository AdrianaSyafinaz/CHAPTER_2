<!DOCTYPE html>
<html>
<head>
    <title>Lab Exercise 2.1 HTML Part B</title>
</head>
<body>

<!-- Outer border box surrounding the form -->
<fieldset style="width: 500px; border: 2px solid black; padding: 20px;">
    <form>
        <h2>LAB EXERCISE 2.1 HTML PART B</h2>

        <!-- Name input -->
        <p>
            <label for="name">Name: </label>
            <input type="text" id="name" name="name">
        </p>

        <!-- Password input -->
        <p>
            <label for="password">Password: </label>
            <input type="password" id="password" name="password">
        </p>

        <!-- Gender radio buttons -->
        <p>
            Gender:<br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label><br>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </p>

        <!-- Age dropdown list -->
        <p>
            <label for="age">Age: </label>
            <select id="age" name="age">
                <option value="" disabled selected>Select Age</option>
                <option value="child">Child</option>
                <option value="teen">Teenager</option>
                <option value="adult">Adult</option>
                <option value="senior">Senior</option>
            </select>
        </p>

        <!-- Interests textarea -->
        <p>
            Interests:<br>
            <textarea name="interests" rows="5" cols="45"></textarea>
        </p>

        <!-- Newsletter checkboxes -->
        <p>
            Subscribe to Newsletter: 
            <input type="checkbox" id="yes" name="newsletter" value="Yes">
            <label for="yes">Yes</label>
            <input type="checkbox" id="no" name="newsletter" value="No">
            <label for="no">No</label>
            <input type="checkbox" id="not_interested" name="newsletter" value="Not Interested">
            <label for="not_interested">Not Interested</label>
        </p>

        <!-- Submit button -->
        <p>
            <input type="submit" value="Submit">
        </p>
    </form>
</fieldset>

</body>
</html>
